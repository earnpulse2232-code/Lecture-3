<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <meta name="theme-color" content="#f8fafc">
    <title>History - Vedic Age (Lecture 3)</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        :root {
            --bg-main: #f8fafc; --bg-card: #ffffff; --primary: #2563eb; --primary-hover: #1d4ed8;
            --primary-light: #eff6ff; --text-dark: #0f172a; --text-muted: #64748b; --border-color: #e2e8f0;
            --green: #10b981; --green-light: #ecfdf5; --red: #ef4444; --red-light: #fef2f2;
            --shadow-sm: 0 1px 3px rgba(0,0,0,0.06); --shadow-lg: 0 10px 15px -3px rgba(0,0,0,0.08);
        }
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: var(--bg-main); color: var(--text-dark); min-height: 100dvh; font-size: 15px; line-height: 1.5; overflow-x: hidden; }
        button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }
        .hidden { display: none !important; }
        .start-screen { position: fixed; inset: 0; background: var(--bg-main); z-index: 100; display: flex; align-items: center; justify-content: center; padding: 20px; overflow-y: auto; }
        .start-card { width: 100%; max-width: 440px; background: var(--bg-card); border-radius: 24px; padding: 36px 28px; box-shadow: var(--shadow-lg); text-align: center; border: 1px solid var(--border-color); }
        .brand-icon { width: 60px; height: 60px; background: var(--primary-light); color: var(--primary); border-radius: 16px; display: flex; align-items: center; justify-content: center; font-size: 26px; margin: 0 auto 16px; }
        .start-title { font-size: 22px; font-weight: 800; margin-bottom: 8px; }
        .start-desc { font-size: 14px; color: var(--text-muted); margin-bottom: 24px; }
        .mode-btn { display: flex; align-items: center; gap: 16px; width: 100%; padding: 16px; background: #fff; border: 1.5px solid var(--border-color); border-radius: 16px; text-align: left; margin-bottom: 12px; transition: all 0.2s ease; }
        .mode-btn:hover { border-color: var(--primary); background: var(--primary-light); transform: translateY(-2px); }
        .mode-icon { width: 48px; height: 48px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 20px; flex-shrink: 0; }
        .mode-icon.quiz { background: #dbeafe; color: #2563eb; }
        .mode-icon.test { background: #d1fae5; color: #059669; }
        .mode-name { font-size: 15px; font-weight: 700; margin-bottom: 2px; }
        .mode-info-txt { font-size: 12px; color: var(--text-muted); }
        .quiz-app { height: 100dvh; display: flex; flex-direction: column; overflow: hidden; }
        .quiz-header { flex-shrink: 0; background: #fff; border-bottom: 1px solid var(--border-color); padding: 12px 18px; }
        .quiz-header-inner { max-width: 900px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 10px; }
        .hdr-brand { font-weight: 700; font-size: 15px; }
        .hdr-timer { padding: 6px 14px; background: #f8fafc; border: 1px solid var(--border-color); border-radius: 20px; font-family: monospace; font-weight: 700; color: var(--primary); }
        .hdr-btn { width: 38px; height: 38px; border-radius: 10px; background: #fff; border: 1px solid var(--border-color); display: flex; align-items: center; justify-content: center; }
        .quiz-main { flex: 1; overflow-y: auto; max-width: 900px; width: 100%; margin: 0 auto; padding: 24px 16px; }
        .q-card { background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 20px; padding: 24px; box-shadow: var(--shadow-sm); }
        .q-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px; }
        .q-num-badge { padding: 5px 12px; background: var(--primary-light); color: var(--primary); border-radius: 20px; font-size: 12px; font-weight: 700; }
        .lang-btn { padding: 5px 12px; border-radius: 20px; border: 1px solid var(--border-color); font-size: 12px; font-weight: 600; background: #fff; display: inline-flex; align-items: center; gap: 6px; }
        .q-text { font-size: 16px; font-weight: 600; line-height: 1.6; margin-bottom: 22px; white-space: pre-line; }
        .opts { display: flex; flex-direction: column; gap: 11px; }
        .opt { display: flex; align-items: center; gap: 14px; padding: 14px 18px; background: #fff; border: 1.5px solid var(--border-color); border-radius: 14px; cursor: pointer; transition: all 0.15s ease; }
        .opt:hover:not(.locked) { border-color: var(--primary); background: #f8fafc; }
        .opt.selected { border-color: var(--primary); background: var(--primary-light); }
        .opt.correct { border-color: var(--green); background: var(--green-light); }
        .opt.wrong { border-color: var(--red); background: var(--red-light); }
        .opt.locked { cursor: default; }
        .opt-letter { width: 32px; height: 32px; border-radius: 50%; border: 1.5px solid var(--border-color); display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 13px; color: var(--text-muted); flex-shrink: 0; }
        .opt.selected .opt-letter { background: var(--primary); color: #fff; border-color: var(--primary); }
        .opt.correct .opt-letter { background: var(--green); color: #fff; border-color: var(--green); }
        .opt.wrong .opt-letter { background: var(--red); color: #fff; border-color: var(--red); }
        .opt-text { flex: 1; font-weight: 600; }
        .opt-tag { font-size: 11px; font-weight: 700; padding: 3px 8px; border-radius: 6px; }
        .opt.correct .opt-tag { background: var(--green); color: #fff; }
        .opt.wrong .opt-tag { background: var(--red); color: #fff; }
        .sol-box { margin-top: 20px; padding: 16px; background: #f8fafc; border-left: 4px solid var(--primary); border-radius: 12px; }
        .sol-head { font-size: 12px; font-weight: 700; text-transform: uppercase; color: var(--primary); margin-bottom: 8px; }
        .quiz-nav { flex-shrink: 0; background: #fff; border-top: 1px solid var(--border-color); padding: 12px 18px; }
        .quiz-nav-inner { max-width: 900px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 10px; }
        .nav-btn { display: flex; align-items: center; gap: 8px; padding: 12px 20px; border-radius: 12px; font-size: 14px; font-weight: 600; }
        .nav-btn.prev { background: #fff; border: 1px solid var(--border-color); }
        .nav-btn.prev:disabled { opacity: 0.4; cursor: not-allowed; }
        .nav-btn.submit { background: var(--green-light); color: #065f46; border: 1px solid #a7f3d0; }
        .nav-btn.next { background: var(--primary); color: #fff; }
        .palette-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 150; display: none; }
        .palette-overlay.open { display: block; }
        .palette-drawer { position: fixed; top: 0; left: 0; bottom: 0; width: min(340px, 85vw); background: #fff; z-index: 160; display: flex; flex-direction: column; transform: translateX(-100%); transition: transform 0.25s; }
        .palette-drawer.open { transform: translateX(0); }
        .pal-head { padding: 18px; border-bottom: 1px solid var(--border-color); display: flex; align-items: center; justify-content: space-between; font-weight: 700; }
        .pal-grid { flex: 1; overflow-y: auto; padding: 16px; display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; align-content: start; }
        .pal-btn { aspect-ratio: 1; border-radius: 10px; border: 1px solid var(--border-color); background: #f8fafc; font-size: 13px; font-weight: 600; display: flex; align-items: center; justify-content: center; }
        .pal-btn.answered { background: var(--green); color: #fff; border-color: var(--green); }
        .pal-btn.current { outline: 2px solid var(--primary); outline-offset: 2px; }
        .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 170; display: none; align-items: center; justify-content: center; padding: 20px; }
        .modal-overlay.open { display: flex; }
        .modal-box { width: 100%; max-width: 420px; background: #fff; border-radius: 20px; padding: 28px; text-align: center; }
        .modal-stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 16px 0 22px; }
        .modal-stat { background: #f8fafc; border-radius: 12px; padding: 14px; border: 1px solid var(--border-color); }
        .modal-stat-num { font-size: 24px; font-weight: 800; }
        .modal-btn { width: 100%; padding: 14px; border-radius: 12px; font-size: 14px; font-weight: 600; margin-bottom: 8px; }
        .modal-btn.confirm { background: var(--primary); color: #fff; }
        .modal-btn.cancel { background: #f1f5f9; }
        .results-screen { position: fixed; inset: 0; background: var(--bg-main); z-index: 180; display: none; overflow-y: auto; padding: 30px 16px 60px; }
        .results-screen.open { display: block; }
        .results-box { max-width: 600px; margin: 0 auto; text-align: center; }
        .res-score-card { background: #0f172a; color: #fff; border-radius: 20px; padding: 28px; margin: 20px 0; }
        .res-score-val { font-size: 54px; font-weight: 800; }
        .res-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 24px; }
        .res-item { background: #fff; border-radius: 14px; padding: 16px; border: 1px solid var(--border-color); }
        .res-item-val { font-size: 22px; font-weight: 700; }
        .toast { position: fixed; top: 20px; left: 50%; transform: translateX(-50%) translateY(-80px); background: #0f172a; color: #fff; padding: 10px 20px; border-radius: 30px; font-size: 13px; font-weight: 600; z-index: 300; opacity: 0; transition: all 0.25s; }
        .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
    </style>
</head>
<body>
    <div class="start-screen" id="startScreen">
        <div class="start-card">
            <div class="brand-icon"><i class="fas fa-om"></i></div>
            <h1 class="start-title">History - Vedic Age</h1>
            <p class="start-desc">Early & Later Vedic Period (Lecture 3)</p>
            <button class="mode-btn" onclick="startApp('quiz')">
                <div class="mode-icon quiz"><i class="fas fa-bolt"></i></div>
                <div><div class="mode-name">Practice Mode</div><div class="mode-info-txt">Har question ke sath instant solution aur explanation dekhein.</div></div>
            </button>
            <button class="mode-btn" onclick="startApp('test')">
                <div class="mode-icon test"><i class="fas fa-clock"></i></div>
                <div><div class="mode-name">Exam Mode</div><div class="mode-info-txt">Timer ke sath exam attempt karein aur detailed scorecard payein.</div></div>
            </button>
        </div>
    </div>

    <div class="quiz-app hidden" id="quizApp">
        <header class="quiz-header">
            <div class="quiz-header-inner">
                <button class="hdr-btn" onclick="openPalette()"><i class="fas fa-th-large"></i></button>
                <div class="hdr-brand">Vedic Age - Lecture 3</div>
                <div class="hdr-timer"><i class="fas fa-stopwatch"></i> <span id="timerText">00:00</span></div>
            </div>
        </header>

        <main class="quiz-main" id="quizMain"></main>

        <nav class="quiz-nav" id="quizNav">
            <div class="quiz-nav-inner">
                <button class="nav-btn prev" id="prevBtn" onclick="prevQuestion()"><i class="fas fa-arrow-left"></i> Previous</button>
                <button class="nav-btn submit" onclick="openSubmitModal()"><i class="fas fa-paper-plane"></i> Submit</button>
                <button class="nav-btn next" id="nextBtn" onclick="nextQuestion()"><span id="nextLabel">Next</span> <i class="fas fa-arrow-right"></i></button>
            </div>
        </nav>
    </div>

    <div class="palette-overlay" id="paletteOverlay" onclick="closePalette()"></div>
    <aside class="palette-drawer" id="paletteDrawer">
        <div class="pal-head"><span>Questions</span><button onclick="closePalette()"><i class="fas fa-times"></i></button></div>
        <div class="pal-grid" id="paletteGrid"></div>
    </aside>

    <div class="modal-overlay" id="submitModal">
        <div class="modal-box">
            <h3>Submit Test?</h3>
            <div class="modal-stats-grid">
                <div class="modal-stat"><div class="modal-stat-num" id="modalAttempted" style="color:var(--green)">0</div><div>Attempted</div></div>
                <div class="modal-stat"><div class="modal-stat-num" id="modalUnattempted" style="color:var(--text-muted)">0</div><div>Unattempted</div></div>
            </div>
            <button class="modal-btn confirm" onclick="confirmSubmit()">Yes, Finish</button>
            <button class="modal-btn cancel" onclick="closeSubmitModal()">Resume</button>
        </div>
    </div>

    <div class="results-screen" id="resultsScreen"><div class="results-box" id="resultsInner"></div></div>
    <div class="toast" id="toast"><span id="toastText"></span></div>

    <script>
        const QUESTIONS = [
            {
                e: "According to references in the Rigveda, the early Vedic Aryans inhabited a region known as:",
                h: "ऋग्वेद में दिए गए संदर्भों के अनुसार, प्रारंभिक वैदिक आर्य ऐसे क्षेत्र में रहते थे जिसे _______ कहा जाता है।",
                oEn: ["Sapta-Sindhu", "Aryavarta", "Madhyadesha", "Brahmavarta"],
                oHi: ["सप्त-सिंधु", "आर्यावर्त", "मध्यदेश", "ब्रह्मवर्त"],
                a: 0,
                sE: "The Early Vedic Aryans lived in the land of the seven rivers called 'Sapta-Sindhu' (Indus and its five tributaries along with the Saraswati).",
                sH: "प्रारंभिक वैदिक आर्यों का मुख्य निवास क्षेत्र 'सप्त-सिंधु' (सिंधु, सरस्वती और पंजाब की पांच नदियों का क्षेत्र) था।"
            },
            {
                e: "Which among the following best represents the change in society from the Early to the Later Vedic period?",
                h: "निम्नलिखित में से कौन-सा, प्रारंभिक वैदिक काल से उत्तर वैदिक काल तक समाज में आए परिवर्तन को सर्वोत्तम रूप से दर्शाता है?",
                oEn: [
                    "Decline of agriculture and rise in hunting",
                    "Emergence of a complex varna hierarchy",
                    "End of religious practices and rituals",
                    "Shift from settled villages to nomadic life"
                ],
                oHi: [
                    "कृषि में गिरावट और शिकार में वृद्धि",
                    "एक जटिल वर्ण पदानुक्रम का उद्भव",
                    "धार्मिक प्रथाओं और अनुष्ठानों का अंत",
                    "बसे हुए गाँवों से चलवासी (यायावर) जीवन की ओर स्थानांतरण"
                ],
                a: 1,
                sE: "The social structure transformed from flexible occupation-based classes in the Early Vedic age to a rigid, hereditary four-fold varna system in the Later Vedic age.",
                sH: "प्रारंभिक वैदिक काल की लचीली सामाजिक व्यवस्था उत्तर वैदिक काल में एक जटिल, कठोर और जन्म-आधारित वर्ण पदानुक्रम में परिवर्तित हो गई।"
            },
            {
                e: "Which of the following texts is considered the earliest Vedic composition depicting the life of early Vedic people?",
                h: "निम्नलिखित में से किस ग्रंथ को प्रारंभिक वैदिक लोगों के जीवन को चित्रित करने वाली सबसे प्राचीन वैदिक रचना माना जाता है?",
                oEn: ["Samaveda", "Atharvaveda", "Rigveda", "Yajurveda"],
                oHi: ["सामवेद", "अथर्ववेद", "ऋग्वेद", "यजुर्वेद"],
                a: 2,
                sE: "The Rigveda is the oldest known Indo-European literary composition, documenting early Vedic tribal life, geography, and religious hymns.",
                sH: "ऋग्वेद सबसे प्राचीन वेद है, जो प्रारंभिक वैदिक काल के लोगों के धार्मिक और सामाजिक जीवन का विस्तृत विवरण देता है।"
            },
            {
                e: "Which of the following Vedas is known as the ‘Veda of Music’ or chants?",
                h: "निम्नलिखित में से किस वेद को 'संगीत का वेद' के रूप में जाना जाता है?",
                oEn: ["Samaveda", "Atharvaveda", "Rigveda", "Yajurveda"],
                oHi: ["सामवेद", "अथर्ववेद", "ऋग्वेद", "यजुर्वेद"],
                a: 0,
                sE: "Samaveda ('Veda of Chants/Music') is the foundation of Indian classical music, containing verses set to musical melodies sung by Udgatri priests.",
                sH: "सामवेद को भारतीय शास्त्रीय संगीत का जनक माना जाता है। इसमें यज्ञों के समय गाए जाने वाले मंत्रों का संकलन है।"
            },
            {
                e: "Which of the following best describes the authorship of the Rigveda?",
                h: "निम्नलिखित में से कौन-सा, ऋग्वेद के कृतित्व का सर्वोत्तम वर्णन करता है?",
                oEn: [
                    "It was composed solely by Sage Vyasa and compiled during the Mahabharata era",
                    "It was dictated by Valmiki as a poetic epic for oral transmission",
                    "It was written by a single philosopher-king in ancient India",
                    "It is a collection of hymns composed by various sages over generations"
                ],
                oHi: [
                    "इसकी रचना पूर्ण रूप से ऋषि व्यास ने की थी और महाभारत काल में इसे संकलित किया गया था।",
                    "इसे वाल्मीकि ने मौखिक प्रसारण के लिए एक काव्य महाकाव्य के रूप में लिखवाया था।",
                    "इसे प्राचीन भारत में एक ही दार्शनिक-राजा ने लिखा था।",
                    "यह पीढ़ियों से विभिन्न ऋषियों द्वारा रचित भजनों का संग्रह है।"
                ],
                a: 3,
                sE: "The Rigveda is a compilation of 1,028 suktas composed across generations by diverse families of rishis (such as Vishvamitra, Vashistha, Gritsamada, and Atri).",
                sH: "ऋग्वेद किसी एक व्यक्ति द्वारा नहीं लिखा गया, बल्कि कई पीढ़ियों में विभिन्न ऋषि-कुटुंबों (विश्वामित्र, वशिष्ठ, भारद्वाज आदि) द्वारा रचित सूक्तों का संकलन है।"
            },
            {
                e: "The early Iron Age in North India is most prominently associated with which pottery culture?",
                h: "उत्तर भारत में प्रारंभिक लौह युग सबसे प्रमुख रूप से किस मृद्भांड संस्कृति से संबंधित है?",
                oEn: [
                    "Painted Grey Ware and Northern Black Polished Ware",
                    "Painted Grey Ware and Black-and-Red Ware",
                    "Ochre Coloured Pottery and Black Slipped Ware",
                    "Northern Black Polished Ware and Red Ware"
                ],
                oHi: [
                    "चित्रित धूसर भांड (PGW) और उत्तरी काले पॉलिश किए गए भांड (NBPW)",
                    "चित्रित धूसर भांड और काले-और-लाल भांड",
                    "गैरिक मृद्भांड और काली चिकनी मिट्टी के घोल वाले भांड",
                    "उत्तरी काले पॉलिश किए गए भांड और लाल भांड"
                ],
                a: 0,
                sE: "The transition to the Iron Age and the Later Vedic culture in northern India corresponds archaeologically with the Painted Grey Ware (PGW) and later Northern Black Polished Ware (NBPW) phases.",
                sH: "उत्तर भारत में प्रारंभिक लौह युग और उत्तर वैदिक संस्कृति का पुरातात्विक संबंध मुख्य रूप से चित्रित धूसर मृद्भांड (PGW) और बाद के NBPW चरण से है।"
            },
            {
                e: "The Rigveda mentions the terms arya varna and dasa varna. In the Early Vedic context, these terms indicate:",
                h: "ऋग्वेद में 'आर्य वर्ण' और 'दास वर्ण' शब्दों का उल्लेख है। प्रारंभिक वैदिक संदर्भ में, ये शब्द किसे इंगित करते हैं?",
                oEn: [
                    "Distinction between Vedic people and non-Vedic groups",
                    "Occupational guilds based on trade specialization",
                    "Fourfold caste hierarchy based strictly on birth",
                    "Political offices within tribal administration"
                ],
                oHi: [
                    "वैदिक व्यक्तियों और गैर-वैदिक समूहों के बीच अंतर",

            {
                e: "How many basic physical elements (Pancha-Mahabhuta) did early Indian philosophers identify to classify all matter?",
                h: "प्राचीन भारतीय दार्शनिकों ने सभी भौतिक पदार्थों को वर्गीकृत करने के लिए कितने मूल तत्वों का वर्णन किया है?",
                oEn: ["Five", "Six", "Three", "Nine"],
                oHi: ["पांच (Five / पंचतत्व)", "छह", "तीन", "नौ"],
                a: 0,
                sE: "Matter was classified into Five Great Elements (Pancha-Bhoota): Earth (Prithvi), Water (Ap), Fire (Tejas), Air (Vayu), and Space/Ether (Akasha).",
                sH: "पदार्थ को पांच मूल तत्वों (क्षिति, जल, पावक, गगन, समीरा) यानी पंचमहाभूत में वर्गीकृत किया गया है।"
            },
            {
                e: "Which Vedanga (limb of the Vedas) is specifically dedicated to etymology and explanation of complex Vedic words?",
                h: "वेदों का कौन-सा अंग (वेदांग) कठिन व जटिल वैदिक शब्दों की व्युत्पत्ति और व्याख्या के लिए जाना जाता है?",
                oEn: ["Vyakaran", "Nirukta", "Chhanda", "Kalpa"],
                oHi: ["व्याकरण", "निरुक्त (Nirukta)", "छंद", "कल्प"],
                a: 1,
                sE: "Nirukta, authored by Yaska, is the Vedanga dealing with etymology, word origin, and semantic interpretation of rare Vedic terms.",
                sH: "महर्षि यास्क द्वारा रचित 'निरुक्त' कठिन वैदिक शब्दों के अर्थ और भाषा-व्युत्पत्ति (Etymology) से संबंधित वेदांग है।"
            },
            {
                e: "The Vedic time period in Indian history roughly spans:",
                h: "भारत में वैदिक काल की समग्र अवधि क्या मानी जाती है?",
                oEn: ["336 to 323 BC", "3000 to 2600 BC", "550 to 323 BC", "1500 to 500 BC"],
                oHi: ["336 से 323 ईसा पूर्व", "3000 से 2600 ईसा पूर्व", "550 से 323 ईसा पूर्व", "1500 से 500 ईसा पूर्व (1500 to 500 BC)"],
                a: 3,
                sE: "The Vedic age broadly dates from 1500 BCE to 500 BCE (divided into Early Vedic ~1500–1000 BCE and Later Vedic ~1000–500 BCE).",
                sH: "वैदिक काल की समय-सीमा सामान्यतः 1500 ईसा पूर्व से 500 ईसा पूर्व तक मानी जाती है।"
            },
            {
                e: "Dhanurveda, the Upaveda associated with Yajurveda, deals with:",
                h: "यजुर्वेद का उपवेद 'धनुर्वेद' किससे संबंधित है?",
                oEn: ["Art of warfare and archery", "Architecture", "Medicine", "Art and music"],
                oHi: ["युद्ध कला और धनुर्विद्या (Art of warfare)", "वास्तुकला", "चिकित्सा", "कला और संगीत"],
                a: 0,
                sE: "Dhanurveda is the ancient Indian science of archery, military strategy, and martial arts.",
                sH: "धनुर्वेद का संबंध सैन्य विज्ञान, युद्ध कला और अस्त्र-शस्त्र चलाने की विद्या से है।"
            },
            {
                e: "There are four canonical Vedas: Rigveda, Samaveda, Yajurveda, and the fourth is _________.",
                h: "चार वेदों में ऋग्वेद, सामवेद, यजुर्वेद और चौथा वेद कौन सा है?",
                oEn: ["Dhanurveda", "Ayurveda", "Shilpaveda", "Atharvaveda"],
                oHi: ["धनुर्वेद", "आयुर्वेद", "शिल्पवेद", "अथर्ववेद (Atharvaveda)"],
                a: 3,
                sE: "The four primary Vedas are Rigveda, Samaveda, Yajurveda, and Atharvaveda.",
                sH: "चौथा वेद 'अथर्ववेद' है, जिसमें दैनिक जीवन के मंत्र, औषधियां और तंत्र-मंत्र संकलित हैं।"
            }
        ];

        const state = {
            current: 0,
            answers: new Array(QUESTIONS.length).fill(null),
            locked: new Array(QUESTIONS.length).fill(false),
            mode: 'test',
            lang: 'en',
            startTime: null,
            timerInterval: null,
            elapsed: 0
        };

        function $(id) { return document.getElementById(id); }

        function toast(msg) {
            const t = $('toast');
            $('toastText').textContent = msg;
            t.classList.add('show');
            setTimeout(() => t.classList.remove('show'), 2000);
        }

        function formatTime(s) {
            const m = Math.floor(s / 60);
            return String(m).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0');
        }

        function startApp(mode) {
            state.mode = mode;
            $('startScreen').classList.add('hidden');
            $('quizApp').classList.remove('hidden');
            state.startTime = Date.now();
            state.timerInterval = setInterval(() => {
                state.elapsed = Math.floor((Date.now() - state.startTime) / 1000);
                $('timerText').textContent = formatTime(state.elapsed);
            }, 1000);
            renderQuestion();
            buildPalette();
        }

        function toggleLang() {
            state.lang = state.lang === 'en' ? 'hi' : 'en';
            renderQuestion();
        }

        function renderQuestion() {
            const i = state.current;
            const q = QUESTIONS[i];
            const isQuiz = state.mode === 'quiz';
            const locked = state.locked[i];
            const userAns = state.answers[i];
            const qTxt = state.lang === 'en' ? q.e : q.h;
            const opts = state.lang === 'en' ? q.oEn : q.oHi;

            let optsHtml = '';
            opts.forEach((opt, idx) => {
                let cls = '', tag = '';
                if (isQuiz && locked) {
                    if (idx === q.a) {
                        cls = 'correct';
                        tag = '<span class="opt-tag">Correct</span>';
                    }
                    if (userAns === idx && idx !== q.a) {
                        cls = 'wrong';
                        tag = '<span class="opt-tag">Your Ans</span>';
                    }
                } else if (userAns === idx) {
                    cls = 'selected';
                }
                optsHtml += `
                    <div class="opt ${cls} ${locked ? 'locked' : ''}" onclick="selectOption(${idx})">
                        <div class="opt-letter">${String.fromCharCode(65 + idx)}</div>
                        <div class="opt-text">${opt}</div>
                        ${tag}
                    </div>
                `;
            });

            const solTxt = state.lang === 'en' ? q.sE : q.sH;
            let solHtml = (isQuiz && locked) ? `
                <div class="sol-box">
                    <div class="sol-head"><i class="fas fa-lightbulb"></i> Explanation</div>
                    <div>${solTxt}</div>
                </div>
            ` : '';

            $('quizMain').innerHTML = `
                <div class="q-card">
                    <div class="q-top">
                        <div class="q-num-badge">Question ${i + 1} of ${QUESTIONS.length}</div>
                        <button class="lang-btn" onclick="toggleLang()">
                            <i class="fas fa-language"></i> ${state.lang === 'en' ? 'हिन्दी' : 'English'}
                        </button>
                    </div>
                    <div class="q-text">${qTxt}</div>
                    <div class="opts">${optsHtml}</div>
                    ${solHtml}
                </div>
            `;

            $('prevBtn').disabled = i === 0;
            $('nextLabel').textContent = i === QUESTIONS.length - 1 ? 'Finish' : 'Next';
            updatePaletteGrid();
        }

        function selectOption(idx) {
            if (state.mode === 'quiz' && state.locked[state.current]) return;
            state.answers[state.current] = idx;
            if (state.mode === 'quiz') {
                state.locked[state.current] = true;
                if (idx === QUESTIONS[state.current].a) {
                    toast('Correct! 🎉');
                } else {
                    toast('Incorrect');
                }
            }
            renderQuestion();
        }

        function prevQuestion() {
            if (state.current > 0) {
                state.current--;
                renderQuestion();
            }
        }

        function nextQuestion() {
            if (state.current < QUESTIONS.length - 1) {
                state.current++;
                renderQuestion();
            } else {
                openSubmitModal();
            }
        }

        function buildPalette() {
            const grid = $('paletteGrid');
            grid.innerHTML = '';
            QUESTIONS.forEach((_, i) => {
                const btn = document.createElement('button');
                btn.className = 'pal-btn';
                btn.id = 'pal-' + i;
                btn.textContent = i + 1;
                btn.onclick = () => {
                    state.current = i;
                    closePalette();
                    renderQuestion();
                };
                grid.appendChild(btn);
            });
            updatePaletteGrid();
        }

        function updatePaletteGrid() {
            QUESTIONS.forEach((_, i) => {
                const btn = $('pal-' + i);
                if (!btn) return;
                btn.className = 'pal-btn';
                if (i === state.current) btn.classList.add('current');
                if (state.answers[i] !== null) btn.classList.add('answered');
            });
        }

        function openPalette() {
            $('paletteDrawer').classList.add('open');$('paletteOverlay').classList.add('open');
        }

        function closePalette() {
            $('paletteDrawer').classList.remove('open');$('paletteOverlay').classList.remove('open');
        }

        function openSubmitModal() {
            const ans = state.answers.filter(a => a !== null).length;
            $('modalAttempted').textContent = ans;
            $('modalUnattempted').textContent = QUESTIONS.length - ans;
            $('submitModal').classList.add('open');
        }

        function closeSubmitModal() {
            $('submitModal').classList.remove('open');
        }

        function confirmSubmit() {
            closeSubmitModal();
            if (state.timerInterval) clearInterval(state.timerInterval);
            let correct = 0, wrong = 0;
            state.answers.forEach((ans, i) => {
                if (ans !== null) {
                    if (ans === QUESTIONS[i].a) correct++;
                    else wrong++;
                }
            });
            $('resultsInner').innerHTML = `
                <h2>Test Completed!</h2>
                <p style="color:var(--text-muted);margin:8px 0;">Total Time: ${formatTime(state.elapsed)}</p>
                <div class="res-score-card">
                    <div class="res-score-val">${correct} / ${QUESTIONS.length}</div>
                    <div>Score</div>
                </div>
                <div class="res-grid">
                    <div class="res-item"><div class="res-item-val" style="color:var(--green)">${correct}</div><div>Correct</div></div>
                    <div class="res-item"><div class="res-item-val" style="color:var(--red)">${wrong}</div><div>Wrong</div></div>
                </div>
                <button class="modal-btn confirm" onclick="location.reload()">Re-attempt</button>
            `;
            $('resultsScreen').classList.add('open');
        }
    </script>
</body>
</html>
